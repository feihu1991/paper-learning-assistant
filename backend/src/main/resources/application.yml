spring:
  application:
    name: paper-tutor
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: jdbc:mysql://localhost:3306/papertutor?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: rootpassword
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# 服务器配置
server:
  port: 8080

# 日志配置
logging:
  level:
    com.papertutor: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# API 文档配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# 文件存储配置
papertutor:
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./media}
  analysis:
    llm-api-key: ${LLM_API_KEY:}
    llm-api-url: ${LLM_API_URL:}
