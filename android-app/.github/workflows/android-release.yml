# Android Release Build CI
# 创建 tag 时自动构建 Release APK 并上传到 GitHub Releases

name: Android Release Build

on:
  push:
    tags:
      - 'v*'  # 匹配 v1.0.0, v2.1.3 等格式的 tag

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要写入权限以创建 Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android-app/gradlew

      - name: Build with Gradle
        run: |
          cd android-app
          ./gradlew build --no-daemon

      - name: Run tests
        run: |
          cd android-app
          ./gradlew test --no-daemon

      - name: Build Release APK
        run: |
          cd android-app
          ./gradlew assembleRelease --no-daemon

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Paper Learning Assistant Android App
            
            **Version:** ${{ steps.get_version.outputs.VERSION }}
            **Build Time:** ${{ github.event.head_commit.timestamp }}
            
            ### Changes
            See the commit history for detailed changes.
            
            ### Installation
            Download and install the APK file below.
          files: |
            android-app/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: android-app/app/build/reports/tests/
          retention-days: 30
