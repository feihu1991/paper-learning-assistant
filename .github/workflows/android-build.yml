name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'
        cache-disabled: true

    - name: Generate release keystore
      run: |
        cd android-app/app
        # Generate a JKS keystore (valid 10000 days)
        keytool -genkeypair \
          -keystore release.keystore \
          -alias release \
          -keyalg RSA -keysize 2048 \
          -validity 10000 \
          -storepass paperlearning2024 \
          -keypass paperlearning2024 \
          -dname "CN=Paper Learning, OU=App, O=PaperLearning, L=Wuhan, ST=Hubei, C=CN" \
          -noprompt
        echo "Keystore generated successfully"
        
    - name: Configure signing
      run: |
        cd android-app
        # Write signing config to gradle.properties
        cat >> gradle.properties << 'EOF'
        PAPER_LEARNING_STORE_FILE=release.keystore
        PAPER_LEARNING_STORE_PASSWORD=paperlearning2024
        PAPER_LEARNING_KEY_ALIAS=release
        PAPER_LEARNING_KEY_PASSWORD=paperlearning2024
        EOF
        
    - name: Build debug APK
      id: build-debug
      run: |
        cd android-app
        ./gradlew assembleDebug --no-daemon
        
    - name: Build release APK
      id: build-release
      run: |
        cd android-app
        ./gradlew assembleRelease --no-daemon
        
    - name: Upload APK files
      if: steps.build-release.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: |
          android-app/app/build/outputs/apk/debug/*.apk
          android-app/app/build/outputs/apk/release/*.apk
        if-no-files-found: error
        retention-days: 7

    - name: Create Git tag
      if: steps.build-release.outcome == 'success'
      run: |
        TAG="v$(date +%Y%m%d-%H%M%S)"
        git tag "$TAG"
        git push origin "refs/tags/$TAG"

    - name: Create GitHub Release
      if: steps.build-release.outcome == 'success'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          android-app/app/build/outputs/apk/debug/*.apk
          android-app/app/build/outputs/apk/release/*.apk
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload error logs on failure
      if: failure()
      run: |
        echo "Build failed! Downloading error logs..."
        for i in 1 2 3; do
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/logs \
            -o error.log && break
          sleep $((i*10))
        done
        echo "done"
        
    - name: Upload error logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-logs
        path: error.log
        if-no-files-found: ignore
        retention-days: 7
