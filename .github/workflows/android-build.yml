name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Verify gradlew exists
      run: |
        echo "Checking gradlew location..."
        ls -la android-app/gradlew
        chmod +x android-app/gradlew
        echo "Gradlew verified!"
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: '8.2'
        
    - name: Build Debug APK
      run: |
        echo "Starting build in directory: $(pwd)"
        echo "Running gradlew from android-app directory..."
        cd android-app
        ./gradlew assembleDebug --no-daemon --stacktrace --info
        echo "Build completed!"
        
    - name: Verify APK exists
      run: |
        echo "Checking APK output..."
        ls -la android-app/app/build/outputs/apk/debug/
        if [ -f "android-app/app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "✅ APK created successfully!"
        else
          echo "❌ APK not found!"
          exit 1
        fi
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: android-app/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        if-no-files-found: error
